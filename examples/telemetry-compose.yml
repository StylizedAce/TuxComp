services:
  redis:
    image: redis:7-alpine
    container_name: sv-telemetry-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - telemetry-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  telemetry:
    image: python:3.11-slim
    container_name: sv-telemetry
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "9000"
      REDIS_URI: "redis://127.0.0.1:6379/0"
      TUXCOMP_TELEMETRY_MODE: "demo"
    ports:
      - "9000:9000"
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir fastapi uvicorn redis &&
        uvicorn telemetry.app:app --host 0.0.0.0 --port 9000
    volumes:
      - ./telemetry:/app/telemetry:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  telemetry-redis-data: