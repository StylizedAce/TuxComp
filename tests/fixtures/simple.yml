services:
  redis:
    image: redis:7-alpine
    container_name: socialvibes-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: app:latest
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://localhost:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data: